[scrapyd]
eggs_dir     = /var/lib/scrapyd/eggs
logs_dir     = /var/lib/scrapyd/logs
dbs_dir      = /var/lib/scrapyd/dbs
# Must stay empty: if set, Scrapyd injects its own FEEDS setting and overrides
# the JSON/CSV/XML feeds configured in books_scraper/settings.py.
items_dir    =
jobs_to_keep = 5
# One job at a time: jobs share the same SQLite file and output files.
max_proc     = 1
# 0.0.0.0 is required in Docker so the API is reachable from outside.
bind_address = 0.0.0.0
http_port    = 6800
